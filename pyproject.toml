[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cadica-severity"
version = "0.1.0"
description = "Patient-level coronary artery disease severity classification on the CADICA dataset"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "ShaunakMishra25", email = "shaunakmishra374@gmail.com" },
]
keywords = [
    "cadica",
    "coronary-artery-disease",
    "medical-imaging",
    "deep-learning",
    "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "Pillow>=10.0",
    "scikit-learn>=1.3",
    "openpyxl>=3.1",
    "matplotlib>=3.7",
    "torch>=2.0",
    "torchvision>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.scripts]
cadica-build-folds = "cadica.cli.build_folds:main"
cadica-sample-frames = "cadica.cli.sample_frames:main"
cadica-prepare-folds = "cadica.cli.prepare_folds:main"
cadica-verify-folds = "cadica.cli.verify_folds:main"
cadica-inspect-folds = "cadica.cli.inspect_folds:main"
cadica-train = "cadica.cli.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "error::FutureWarning",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
